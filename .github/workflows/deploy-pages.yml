name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.4.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Prepare Pages artifact
        run: |
          cp dist/public/index.html dist/public/404.html
          mkdir -p dist/public/v1 dist/public/v2
          cp dist/public/index.html dist/public/v1/index.html
          cp dist/public/index.html dist/public/v2/index.html
          mkdir -p dist/public/historias/juliana-rafael dist/public/historias/mariana-felipe dist/public/historias/camila-andre
          cp dist/public/index.html dist/public/historias/juliana-rafael/index.html
          cp dist/public/index.html dist/public/historias/mariana-felipe/index.html
          cp dist/public/index.html dist/public/historias/camila-andre/index.html
          touch dist/public/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
